name: Julia tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia 1.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '2'
      - name: Prepare optional Metal tests
        if: matrix.os == 'macos-latest'
        run: julia --project=test/metal -e 'using Pkg; Pkg.instantiate(; allow_build=false)'
      - name: Test Metal kernels when a GPU is available
        if: matrix.os == 'macos-latest'
        run: >-
          julia --project=test/metal -e 'using Metal;
          if Metal.functional(); include("test/metal.jl");
          else; @warn "Metal tests skipped: this runner has no usable GPU"; end'
        env:
          JULIA_NUM_THREADS: '1'
